name: Android perf APK

# Builds an installable arm64 APK from this fork with an engine built here from
# source, so a newer engine branch (qemu-ios dev/perf) can be tested on a phone
# without a development machine.
#
# What is rebuilt: the Kotlin/Compose app, the JNI/native frontend
# (libun1box_jni.so) and the engine (libqemu-arm.so) from the requested
# engine ref.
#
# The `variant` input picks what is assembled: `release` (the default) is the
# shipped shape -- minified, no debug-env/QMP channels -- and `debug` keeps the
# diagnostic channels for a run that needs them. Both carry the pinned ARM64
# ANGLE provider when `angle_arm64` is on, and both default to the platform GLES
# driver: the bundled ANGLE is selectable, not selected.
#
# What is reused: firmwarekit (device preparation), its one-shot booter, the
# USB bridge and it_seal are extracted from a published release APK. The two
# guest itpacks are then replaced with a matching serial-42 artifact from the
# guest-package workflow, so the host-side engine fix ships with its guest side.
#
# The APK is signed with a keystore generated on the first run and reused after
# that, so successive runs of this workflow update each other in place. It is
# NOT signed with the key of the published releases, so installing it over a
# published APK needs an uninstall first (which erases the app's prepared
# devices; the APK carries firmwarekit, so they can be prepared again).
#
# Inputs and caches are pinned by content, not by date. The dependency cache's
# key covers everything build-deps.py and build-crypto-deps.py record (the
# archives, patches and scripts, the NDK's source.properties, the Meson and Ninja
# versions), so a hit is a tree those scripts accept and the build step is
# skipped. The engine cache keeps one tree per engine revision and restores the
# newest one as a prefix, which build-engine.py updates in place when only the
# source revision changed (--source-update); a tree whose configuration changed
# is refused before anything compiles and rebuilt from scratch. If a run fails in
# the engine step with a cache-refusal message, delete the `lt-engine-*` cache
# and re-run.
#
# Opening a pull request (or pushing to one) starts this workflow too, but it builds nothing until a person
# confirms it: the `confirm` job holds the run on the `perf-apk` environment, and Approve in the run's review
# banner lets it go, so a ten-minute engine build does not start on its own while a change is still a draft. A
# pull request run takes the defaults below and never publishes a pre-release; a manual run keeps its inputs.
# The environment is repository configuration, not this file: Settings > Environments > `perf-apk` with
# "Required reviewers" ticks the gate; without one GitHub uses the environment ungated and runs start at once.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      engine_repository:
        description: Engine source repository
        required: true
        default: KlugKlugTG/qemu-ios
      engine_ref:
        description: Engine branch, tag or commit to build
        required: true
        default: perf
      base_release_repository:
        description: Release whose APK supplies firmwarekit, USB bridge and guest tools
        required: true
        default: blake-lucas/LightTouch
      base_release_tag:
        description: Release tag for those inputs (e.g. v0.0.10, or "latest")
        required: false
        default: v0.0.10
      guest_package_run_id:
        description: Successful guest-package workflow run to use (blank searches all branches for the latest compatible artifact)
        required: false
        default: ""
      jobs:
        description: Parallel compile jobs (the engine scripts ask for -j2 explicitly)
        required: true
        default: "4"
      debuggable:
        description: Debuggable APK (debug variant only) - needed for files/debug-env engine switches and adb run-as
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      angle_arm64:
        description: Package the pinned ARM64 ANGLE provider (the debug angle-gl route)
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      angle_bundle_url:
        description: ARM64 ANGLE bundle (libs/, closure.json, notices/)
        required: true
        default: https://github.com/KlugKlugTG/Un1box/releases/download/angle-arm64-v8a-4a5ccd7/angle-lighttouch-arm64-v8a.tar.gz
      angle_bundle_sha256:
        description: Expected SHA256 of that bundle
        required: true
        default: "c1fc24118f0251f334495a5357bf00e0904a9d70a2faec6ce9674c07c35537e1"
      variant:
        description: Gradle variant to assemble - release is the shipped shape, debug keeps debug-env and the QMP tools
        type: choice
        options:
          - release
          - debug
        default: release
      dependency_verification:
        description: Gradle dependency verification against Android/gradle/verification-metadata.xml
        type: choice
        options:
          - strict
          - lenient
          - off
        default: strict
      create_release:
        description: Attach the APK to a pre-release of this repository
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      jailbreak:
        description: Build the jailbreak APK (--jailbreak on every preparation, jb-tar shipped)
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
  # The jailbreak build's entry point (jailbreak-apk.yml): the same build, with preparation passing
  # --jailbreak and jb-tar shipped for it. Only the inputs that workflow sets are declared here; the rest
  # keep the workflow_dispatch defaults above.
  workflow_call:
    inputs:
      engine_repository:
        type: string
        default: KlugKlugTG/qemu-ios
      engine_ref:
        type: string
        default: perf
      base_release_repository:
        type: string
        default: blake-lucas/LightTouch
      base_release_tag:
        type: string
        default: v0.0.10
      variant:
        type: string
        default: release
      debuggable:
        type: string
        default: "true"
      angle_arm64:
        type: string
        default: "true"
      dependency_verification:
        type: string
        default: strict
      create_release:
        type: string
        default: "true"
      jailbreak:
        description: Build the jailbreak APK (--jailbreak on every preparation, jb-tar shipped)
        type: string
        default: "false"

permissions:
  actions: read
  contents: write

concurrency:
  # One run per pull request (or per branch of a manual run), so a pull request's build never queues behind a
  # manual run of another branch.
  group: android-perf-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # The confirmation a pull request's build waits for. A manual run skips it.
  confirm:
    name: Confirm the pull request build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: perf-apk
    steps:
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Approved: building ${{ github.event.pull_request.head.sha }} of ${{ github.event.pull_request.head.repo.full_name }}"
          echo "pull request #${{ github.event.pull_request.number }}: $PR_TITLE"

  perf-apk:
    needs: confirm
    # A skipped confirmation (a manual run) is fine; a rejected or cancelled one is not.
    if: always() && needs.confirm.result != 'failure' && needs.confirm.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 28.2.13676358
      # A pull request run has no inputs: these are the workflow_dispatch defaults. They live here, not inside
      # the steps, so no ${{ }} can end up inside a shell expansion (a missing brace there swallows the script).
      LT_JOBS: ${{ inputs.jobs || '4' }}
      ENGINE_REPO: ${{ inputs.engine_repository || 'KlugKlugTG/qemu-ios' }}
      ENGINE_REF: ${{ inputs.engine_ref || 'perf' }}
      DECLARED_BASE_RELEASE_REPO: ${{ inputs.base_release_repository || 'blake-lucas/LightTouch' }}
      DECLARED_BASE_RELEASE_TAG: ${{ inputs.base_release_tag || 'v0.0.10' }}
      DECLARED_DEBUGGABLE: ${{ inputs.debuggable || 'true' }}
      DECLARED_VARIANT: ${{ inputs.variant || 'release' }}
      DECLARED_ANGLE_ARM64: ${{ inputs.angle_arm64 || 'true' }}
      ANGLE_BUNDLE_URL: ${{ inputs.angle_bundle_url || 'https://github.com/KlugKlugTG/Un1box/releases/download/angle-arm64-v8a-4a5ccd7/angle-lighttouch-arm64-v8a.tar.gz' }}
      ANGLE_BUNDLE_SHA256: ${{ inputs.angle_bundle_sha256 || 'c1fc24118f0251f334495a5357bf00e0904a9d70a2faec6ce9674c07c35537e1' }}
      DECLARED_DEPENDENCY_VERIFICATION: ${{ inputs.dependency_verification || 'strict' }}
      # The jailbreak build, when this run is the one jailbreak-apk.yml calls. Everything it changes is
      # gated on this: the Gradle property that carries --jailbreak and stages jb-tar, the names below, and
      # the release tag. A normal run has "false" and is byte-for-byte the build it was before.
      DECLARED_JAILBREAK: ${{ inputs.jailbreak || 'false' }}
      MESON: ${{ github.workspace }}/meson/bin/meson

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4

      - name: Check out the engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: qemu-ios
          fetch-depth: 1

      - name: Record the engine revision
        id: engine
        run: |
          echo "sha=$(git -C qemu-ios rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "APK is named ci/Un1box-<engine>-arm64-$DECLARED_VARIANT.apk"

      - name: Extract firmwarekit, USB bridge and guest tools from the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RELEASE_REPO: ${{ env.DECLARED_BASE_RELEASE_REPO }}
          BASE_RELEASE_TAG: ${{ env.DECLARED_BASE_RELEASE_TAG }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, pathlib, re, shutil, subprocess, urllib.request, zipfile

          UPSTREAM_REPO = 'blake-lucas/LightTouch'
          raw_repo = os.environ.get('BASE_RELEASE_REPO', '').strip().strip('"\' ')
          raw_tag = os.environ.get('BASE_RELEASE_TAG', '').strip().strip('"\' ')

          repo = raw_repo.strip('/') or UPSTREAM_REPO
          tag = raw_tag

          m_repo = re.match(r'^https?://github\.com/([^/]+/[^/]+?)(?:\.git)?(?:/releases/tag/([^/?#]+))?/?$', repo)
          if m_repo:
              repo = m_repo.group(1)
              if m_repo.group(2) and (not tag or tag.lower() == 'latest'):
                  tag = m_repo.group(2)
          m_tag = re.match(r'^https?://github\.com/([^/]+/[^/]+?)/releases/tag/([^/?#]+)/?$', tag)
          if m_tag:
              repo = m_tag.group(1)
              tag = m_tag.group(2)

          def api_json(endpoint: str):
              proc = subprocess.run(
                  ['gh', 'api', endpoint],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              if proc.returncode == 0:
                  return json.loads(proc.stdout)
              req = urllib.request.Request(
                  f'https://api.github.com/{endpoint.lstrip("/")}',
                  headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'un1box-ci'},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          def pick_apk(rel):
              assets = rel.get('assets') or []
              for pat in ('*android-arm64*.apk', '*arm64*.apk', '*.apk'):
                  matches = [a for a in assets if fnmatch.fnmatch(a.get('name', ''), pat)]
                  if matches:
                      return matches[0]
              return None

          def find_in_repo(target_repo: str, target_tag: str):
              if target_tag and target_tag.lower() != 'latest':
                  candidates = [target_tag]
                  candidates.append(target_tag[1:] if target_tag.startswith('v') else f'v{target_tag}')
                  for cand in candidates:
                      try:
                          rel = api_json(f'repos/{target_repo}/releases/tags/{cand}')
                          if not rel.get('draft'):
                              return rel, None
                      except Exception:
                          pass
              try:
                  releases = [r for r in api_json(f'repos/{target_repo}/releases?per_page=100') if not r.get('draft')]
              except Exception as exc:
                  return None, f'could not query releases of {target_repo}: {exc}'
              if not target_tag or target_tag.lower() == 'latest':
                  for rel in releases:
                      if not rel.get('tag_name', '').startswith('ci-') and pick_apk(rel):
                          return rel, releases
                  for rel in releases:
                      if pick_apk(rel):
                          return rel, releases
                  return None, releases
              candidates = [target_tag, target_tag[1:] if target_tag.startswith('v') else f'v{target_tag}']
              lower_map = {r.get('tag_name', '').lower(): r for r in releases}
              for cand in candidates:
                  if cand.lower() in lower_map:
                      return lower_map[cand.lower()], releases
              return None, releases

          chosen, info = find_in_repo(repo, tag)
          resolved_repo = repo
          if chosen is None and repo.lower() != UPSTREAM_REPO.lower() and re.match(r'^v?0\.0\.\d+$', tag):
              fb_rel, _ = find_in_repo(UPSTREAM_REPO, tag)
              if fb_rel is not None:
                  print(f"::warning::Release '{raw_tag}' was not found in '{repo}'; using upstream '{UPSTREAM_REPO}' ({fb_rel['tag_name']}) instead")
                  chosen = fb_rel
                  resolved_repo = UPSTREAM_REPO

          if chosen is None:
              if isinstance(info, list):
                  avail = ', '.join(r.get('tag_name', '?') for r in info[:15]) or '<none>'
                  msg = f"Release '{raw_tag}' not found in '{repo}' (available tags: {avail})"
              else:
                  msg = f"Release '{raw_tag}' not found in '{repo}' ({info})"
              print(f'::error::{msg}')
              raise SystemExit(1)

          resolved_tag = chosen['tag_name']
          asset = pick_apk(chosen)
          if asset is None:
              avail_assets = ', '.join(a.get('name', '?') for a in (chosen.get('assets') or [])) or '<none>'
              print(f"::error::Release '{resolved_tag}' in '{resolved_repo}' carries no APK asset (assets: {avail_assets})")
              raise SystemExit(1)

          asset_name = asset['name']
          download_url = asset['browser_download_url']
          ci = pathlib.Path('ci')
          base_dir = ci / 'base'
          base_dir.mkdir(parents=True, exist_ok=True)
          apk = base_dir / asset_name
          print(f'Downloading {asset_name} from {resolved_repo}@{resolved_tag} ...')

          dl = subprocess.run([
              'gh', 'release', 'download', resolved_tag,
              '-R', resolved_repo,
              '--pattern', asset_name,
              '--dir', str(base_dir), '--clobber',
          ])
          if dl.returncode != 0 or not apk.is_file():
              print('gh release download failed; falling back to direct HTTPS download ...')
              subprocess.run(
                  ['curl', '-fL', '--retry', '3', '--retry-delay', '2', '-o', str(apk), download_url],
                  check=True,
              )

          wanted_keys = (
              'assets/guest-tools/armv6.itpack', 'assets/guest-tools/armv7.itpack',
              'assets/guest-tools/it_seal', 'assets/licenses/firmwarekit/manifest.json',
              'lib/arm64-v8a/libfirmwarekit.so', 'lib/arm64-v8a/liblighttouch_oneshot.so',
              'lib/arm64-v8a/libusbmuxd_qemu.so', 'lib/arm64-v8a/liblt_appservice.so',
          )

          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              missing = [key for key in wanted_keys if key not in names]
              if missing:
                  raise SystemExit(f'{apk.name} does not carry {missing}')

              def copy_tree(prefix, destination):
                  destination = pathlib.Path(destination)
                  for name in names:
                      if not name.startswith(prefix) or name.endswith('/'):
                          continue
                      output = destination / name[len(prefix):]
                      output.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(name) as source, open(output, 'wb') as target:
                          shutil.copyfileobj(source, target)
                      mode = archive.getinfo(name).external_attr >> 16
                      if mode:
                          os.chmod(output, mode & 0o7777)
                  return destination

              copy_tree('assets/guest-tools/', ci / 'guest-tools')
              copy_tree('assets/licenses/firmwarekit/', ci / 'firmwarekit/android/licenses')
              executables = {
                  'lib/arm64-v8a/libfirmwarekit.so': ci / 'firmwarekit/android/firmwarekit',
                  'lib/arm64-v8a/liblighttouch_oneshot.so': ci / 'firmwarekit/android/lighttouch-oneshot',
                  'lib/arm64-v8a/libusbmuxd_qemu.so': ci / 'mobile-services/arm64-v8a/libusbmuxd_qemu.so',
                  'lib/arm64-v8a/liblt_appservice.so': ci / 'mobile-services/arm64-v8a/liblt_appservice.so',
              }
              for name, output in executables.items():
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(name))
                  os.chmod(output, 0o755)

          shutil.rmtree(base_dir, ignore_errors=True)

          for required in (
              'guest-tools/armv6.itpack', 'guest-tools/armv7.itpack', 'guest-tools/it_seal',
              'firmwarekit/android/firmwarekit', 'firmwarekit/android/lighttouch-oneshot',
              'firmwarekit/android/licenses/manifest.json',
              'mobile-services/arm64-v8a/libusbmuxd_qemu.so',
              'mobile-services/arm64-v8a/liblt_appservice.so',
          ):
              path = ci / required
              if not path.is_file():
                  raise SystemExit(f'missing extracted input: {path}')

          env_path = os.environ.get('GITHUB_ENV')
          if env_path:
              with open(env_path, 'a', encoding='utf-8') as env_file:
                  env_file.write(f'BASE_RELEASE_RESOLVED={resolved_repo} {resolved_tag} ({asset_name})\n')
          print(f'extracted firmwarekit, USB bridge and guest tools from {resolved_repo}@{resolved_tag} ({asset_name})')
          PY

      - name: Overlay guest packages serial 42
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.guest_package_run_id || '' }}
        run: |
          set -euo pipefail
          WORKFLOW_ID=400843872
          CURRENT_PATCH_SHA="$(git hash-object ci/engine-patches/0001-engine-un1box-features.patch)"
          # Retention is storage policy, not a package-build input. Ignore those YAML lines so the
          # already-built package stays reusable when we extend its retention period.
          CURRENT_WORKFLOW_SHA="$(python3 - <<'PYHASH'
          import hashlib, pathlib, re
          text = pathlib.Path('.github/workflows/guest-package.yml').read_text()
          text = re.sub(r'(?m)^[ \t]*retention-days:[ \t]*[0-9]+[ \t]*\r?$', '', text)
          print(hashlib.sha256(text.encode()).hexdigest())
          PYHASH
          )"
          SELECTED_RUN=""

          workflow_matches_source() {
            local run_id="$1" package_sha package_patch package_workflow
            package_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')" || return 1
            package_patch="$(gh api "repos/$GITHUB_REPOSITORY/contents/ci/engine-patches/0001-engine-un1box-features.patch?ref=$package_sha" --jq '.sha')" || return 1
            [ "$package_patch" = "$CURRENT_PATCH_SHA" ] || return 1
            package_workflow="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/guest-package.yml?ref=$package_sha" --jq '.content' | base64 --decode | python3 -c 'import hashlib,re,sys; text=sys.stdin.read(); text=re.sub(r"(?m)^[ \t]*retention-days:[ \t]*[0-9]+[ \t]*\r?$", "", text); print(hashlib.sha256(text.encode()).hexdigest())')" || return 1
            [ "$package_workflow" = "$CURRENT_WORKFLOW_SHA" ]
          }

          for attempt in $(seq 1 30); do
            if [ -n "$REQUESTED_RUN_ID" ]; then
              CANDIDATES="$REQUESTED_RUN_ID"
            else
              # Search every branch. The guest package is reusable when its patch and build recipe
              # match; requiring the APK PR's branch misses valid artifacts from an earlier PR.
              CANDIDATES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?per_page=100" \
                --jq '.workflow_runs[] | select(.conclusion == "success") | .id')"
            fi

            while IFS= read -r RUN_ID; do
              [ -n "$RUN_ID" ] || continue
              HAS_ARTIFACT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "Un1box-guest-packages-42" and .expired == false)] | length')"
              [ "$HAS_ARTIFACT" -gt 0 ] || continue
              if workflow_matches_source "$RUN_ID"; then
                SELECTED_RUN="$RUN_ID"
                break
              fi
              echo "Skipping guest-package run $RUN_ID: its GLES patch or package build recipe differs."
            done <<< "$CANDIDATES"
            [ -n "$SELECTED_RUN" ] && break

            if [ -n "$REQUESTED_RUN_ID" ]; then
              PACKAGE_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID" --jq '.status')"
              [ "$PACKAGE_STATUS" != completed ] || break
              if ! workflow_matches_source "$REQUESTED_RUN_ID"; then
                echo '::error::The requested guest-package run has a different patch or build recipe.'
                exit 1
              fi
            else
              # Wait only for a pending package build with the same inputs, not unrelated runs.
              PENDING_RUNS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?per_page=100" \
                --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | .[].id')"
              MATCHING_PENDING=0
              while IFS= read -r RUN_ID; do
                [ -n "$RUN_ID" ] || continue
                if workflow_matches_source "$RUN_ID"; then
                  MATCHING_PENDING=1
                  break
                fi
              done <<< "$PENDING_RUNS"
              [ "$MATCHING_PENDING" -gt 0 ] || break
            fi
            echo "Waiting for a matching serial-42 guest-package artifact ($attempt/30)..."
            sleep 20
          done

          [ -n "$SELECTED_RUN" ] || {
            echo '::error::No unexpired serial-42 guest-package artifact with matching source was found across branches. Build/approve the guest-package workflow or provide guest_package_run_id.'
            exit 1
          }
          PACKAGE_DIR="$RUNNER_TEMP/guest-packages-42"
          mkdir -p "$PACKAGE_DIR"
          gh run download "$SELECTED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name Un1box-guest-packages-42 --dir "$PACKAGE_DIR"
          test -s "$PACKAGE_DIR/armv6.itpack"
          test -s "$PACKAGE_DIR/armv7.itpack"
          python3 - "$PACKAGE_DIR" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              fields = line.split(None, 1)
              if len(fields) != 2:
                  raise SystemExit(f'invalid SHA256SUMS entry: {line!r}')
              name = pathlib.Path(fields[1].strip().lstrip('*')).name
              if name in expected:
                  raise SystemExit(f'duplicate checksum for {name}')
              expected[name] = fields[0].lower()
          for name in ('armv6.itpack', 'armv7.itpack'):
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'missing guest package: {path}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if expected.get(name) != actual:
                  raise SystemExit(f'{name}: checksum mismatch (manifest={expected.get(name)}, actual={actual})')
              print(f'{name}: SHA-256 verified')
          PY
          install -m 0644 "$PACKAGE_DIR/armv6.itpack" ci/guest-tools/armv6.itpack
          install -m 0644 "$PACKAGE_DIR/armv7.itpack" ci/guest-tools/armv7.itpack
          echo "GUEST_PACKAGE_RUN_ID=$SELECTED_RUN" >> "$GITHUB_ENV"
          echo "Overlaid serial-42 armv6/armv7 itpacks from workflow run $SELECTED_RUN."

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          df -h / | tail -1
          # The engine build trees, the NDK and Gradle are the three big ones; the
          # image ships several preinstalled NDKs and system images we do not use.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/sources \
            /usr/local/share/chromium /usr/lib/firefox /var/lib/docker/overlay2/* || true
          df -h / /mnt 2>/dev/null | tail -3
      - name: Install host tools, NDK 28.2 and CMake 3.22.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config python3-venv perl autoconf automake libtool
          python3 -m venv meson
          meson/bin/pip install --quiet --disable-pip-version-check meson==1.10.0 packaging==24.0
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          ninja --version
          meson/bin/meson --version

      # firmwarekit's iPad 1 (k48) recipe shells out to iBoot32Patcher for the iBoot RSA/debug/boot-args
      # patches and looks for it next to its own executable (or at FIRMWAREKIT_IBOOT_PATCHER). On macOS it
      # is in the app bundle; on Android nothing carried it, so preparing an iPad died with
      # "iBoot32Patcher (/iBoot32Patcher) not runnable: ... The file doesn't exist." It is a few hundred
      # lines of C with no dependencies beyond libc, pinned with its patch in build-support, so it is built
      # here from that pin and staged like the other executables: the Gradle build packages
      # ci/firmwarekit/android/iBoot32Patcher as libiBoot32Patcher.so, and FirmwareService names it in the
      # child's environment. The same step builds the spawn shim: the recipe launches the patcher as "env <path>
      # ...", a bare name that Android's posix_spawn resolves against the working directory only and /usr/bin does
      # not exist to satisfy, so the shim is preloaded into firmwarekit, runs the patcher directly in env's place
      # and logs every access and spawn it sees (FirmwareService names the log). Only the NDK's compiler, readelf
      # and the sources in this repository are used.
      #
      # The reused firmwarekit (v0.0.10) spawns that path directly and reads FIRMWAREKIT_IBOOT_PATCHER --
      # checked in its strings, not assumed. Packages/FirmwareKit's own K48IBoot.patchIBoot runs it through
      # /usr/bin/env instead, which Android has no such path for: a firmwarekit built from this tree, or
      # reused from a newer tag, must stop spawning that (run the tool directly, or use /bin/env, which
      # Android's toybox does provide) or the iPad path breaks again the moment the reuse tag moves.
      # The app-service helper is what carries a package into the guest (its push and pull actions),
      # and the one in the base release predates them: without this, the Jailbreak tab's Install says
      # "Unknown argument" and nothing is staged. Android/native-services/lt_appservice.c is built here
      # with the pinned libraries Android/packaging/build-mobile-android.py fetches by hash; the
      # extracted copy stays as the fallback, and the built one is checked for the actions themselves
      # (strings is what a host can ask an Android binary).
      - name: Cache the guest app services built here
        uses: actions/cache@v4
        with:
          path: ci/mobile-services-built
          key: lt-mobile-services-${{ hashFiles('Android/native-services/lt_appservice.c', 'Android/packaging/build-mobile-android.py', 'build-support/dependencies.json') }}

      - name: Build the guest app services for arm64 Android
        continue-on-error: true
        run: |
          if [ -f ci/mobile-services-built/arm64-v8a/liblt_appservice.so ]; then
            echo "restored from the cache"
          else
            python3 Android/packaging/build-mobile-android.py ci/mobile-services-built \
              --ndk "$ANDROID_NDK_ROOT" --jobs "$LT_JOBS"
          fi
          for name in liblt_appservice.so libusbmuxd_qemu.so; do
            file="ci/mobile-services-built/arm64-v8a/$name"
            [ -f "$file" ] || { echo "::error::the services build left no $name"; exit 1; }
          done
          if strings ci/mobile-services-built/arm64-v8a/liblt_appservice.so | grep -q 'push|pull'; then
            cp ci/mobile-services-built/arm64-v8a/*.so ci/mobile-services/arm64-v8a/
            echo "the APK will carry this build's app-service helper"
          else
            echo "::error::the helper built here has no push/pull: the APK would keep the base release's"
            exit 1
          fi

      - name: Build iBoot32Patcher and the spawn shim for arm64 Android
        run: |
          python3 - <<'PY' > /tmp/iboot32patcher-pin
          import json
          package = next(p for p in json.load(open('build-support/dependencies.json'))['packages']
                         if p['name'] == 'iBoot32Patcher')
          print(package['url'], package['sha256'], package['directory'])
          PY
          read -r URL SHA DIR < /tmp/iboot32patcher-pin
          curl -fsSL --retry 3 -o /tmp/iboot32patcher.tar.gz "$URL"
          echo "$SHA  /tmp/iboot32patcher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/iboot32patcher.tar.gz -C /tmp
          patch -p1 -d "/tmp/$DIR" < build-support/patches/iBoot32Patcher-ltm.patch
          TOOLS="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # 16 KiB LOAD alignment, like every other executable this APK carries (Android/scripts/check-apk.py).
          "$TOOLS/aarch64-linux-android29-clang" -O2 -Wno-multichar -Wno-int-conversion -I"/tmp/$DIR" \
            -Wl,-z,max-page-size=16384 "/tmp/$DIR"/src/*.c -o ci/firmwarekit/android/iBoot32Patcher
          chmod 755 ci/firmwarekit/android/iBoot32Patcher
          "$TOOLS/llvm-readelf" -h ci/firmwarekit/android/iBoot32Patcher | grep -q 'AArch64'
          python3 build-support/stage-iboot32patcher-notice.py ci/firmwarekit/android/licenses "/tmp/$DIR/LICENSE"
          # The recipe launches the patcher as "env <patcher> <in> <out> --rsa ...": a bare name, which macOS
          # resolves on PATH and Android does not (bionic's posix_spawn searches nothing). This library is put in
          # front of that spawn with LD_PRELOAD: it runs the patcher directly where env was asked for, and logs
          # every access and spawn the process makes, so a failure names the path that was actually wanted.
          "$TOOLS/aarch64-linux-android29-clang" -O2 -fPIC -shared -Wl,-soname,libspawnshim.so \
            -o ci/firmwarekit/android/spawn-shim.so Packages/FirmwareKit/build-support/spawn-shim.c -ldl
          # firmwarekit's jailbreak option installs Cydia by running the host's tar ("-tf", "-tvf" and
          # "-xkf ... -C ... --exclude ..."). Android has no /usr/bin/tar and toybox's has neither -k nor
          # --exclude, so this small tar is built for arm64 and the same shim redirects that path to it.
          # The Gradle build stages it as libjbTar.so only when -Pjailbreak=true.
          "$TOOLS/aarch64-linux-android29-clang" -O2 -Wall -Wextra -Wl,-z,max-page-size=16384 \
            -o ci/firmwarekit/android/jb-tar Packages/FirmwareKit/build-support/jb-tar.c -lz
          "$TOOLS/llvm-readelf" -h ci/firmwarekit/android/jb-tar | grep -q 'AArch64'
          "$TOOLS/llvm-readelf" -h ci/firmwarekit/android/spawn-shim.so | grep -q 'AArch64'
          ls -la ci/firmwarekit/android/iBoot32Patcher ci/firmwarekit/android/spawn-shim.so ci/firmwarekit/android/jb-tar

      # The patches carry changes to the engine's own build scripts (0012 adds
      # --enable-encoder=aac to contrib/portable/build-deps.py, which is what builds FFmpeg for
      # this engine), so they go on before the recipes are fingerprinted and the dependencies are
      # built. Fingerprinted and built unpatched, a patch that changes a dependency recipe does
      # not change its cache key: a prefix without the AAC encoder is restored, the build that
      # would add it is skipped, and 0012's encoder program finds no encoder at runtime.
      #
      # build-engine.py refuses a dirty source tree ("Commit source changes before a
      # reproducible engine build"), so the patch is committed here; fixed dates keep that
      # commit, and with it the recorded revision and the engine cache key, stable. `git add -A`
      # matters as much as the commit: a patch that *adds* a file (the microphone's
      # hw/arm/host-mic.c and its header) leaves it untracked, and `commit -a` alone leaves it
      # behind, which is a dirty tree to the guard even after the commit.
      - name: Patch the engine for Android
        run: |
          git -C qemu-ios apply "$GITHUB_WORKSPACE"/ci/engine-patches/*.patch
          git -C qemu-ios add -A
          GIT_AUTHOR_DATE=2001-01-01T00:00:00Z GIT_COMMITTER_DATE=2001-01-01T00:00:00Z \
            git -C qemu-ios -c user.name=ci -c user.email=ci@localhost \
            commit -q -m "ci: engine patches (slirp DNS, GLES, TCG fast paths, microphone, buffer mapping, Voice Memos AAC)"
          git -C qemu-ios log --oneline -1
          git -C qemu-ios status --porcelain

      # Everything the dependency and engine scripts record in their recipes, as two strings: a cache
      # keyed by them holds a tree those scripts accept, so the build can be skipped instead of run
      # again over a complete tree. A file a recipe records but this engine ref does not carry is
      # written into the string as absent, so such a ref still gets a key (and never a stale hit).
      # Both are read from the patched tree, so a patch that changes a recipe changes its key.
      - name: Fingerprint the dependency and engine recipes
        id: recipes
        run: |
          recorded() {
            for path in "$@"; do
              if [ -f "$path" ]; then sha256sum "$path"; else echo "absent $path"; fi
            done
          }
          toolchain() {
            echo "$ANDROID_NDK_ROOT"
            recorded "$ANDROID_NDK_ROOT/source.properties"
            "$MESON" --version 2>/dev/null || echo 'absent meson'
            ninja --version 2>/dev/null || echo 'absent ninja'
          }
          deps=$( {
            toolchain
            recorded qemu-ios/contrib/portable/dependencies.json \
              qemu-ios/contrib/portable/crypto-dependencies.json \
              qemu-ios/contrib/portable/cache.py \
              qemu-ios/contrib/portable/build-deps.py \
              qemu-ios/contrib/portable/build-crypto-deps.py \
              qemu-ios/contrib/portable/libgpg-error-android-lock.patch \
              qemu-ios/contrib/ffmpeg/*.patch \
              qemu-ios/subprojects/packagefiles/libslirp-set-restricted.patch
          } | sha256sum | cut -c1-24 )
          engine=$( {
            toolchain
            recorded qemu-ios/contrib/portable/build-engine.py \
              qemu-ios/contrib/portable/engine-cache.py \
              qemu-ios/contrib/portable/cache.py \
              qemu-ios/contrib/portable/make-shared.py \
              qemu-ios/contrib/portable/dependencies.json \
              qemu-ios/contrib/portable/crypto-dependencies.json
          } | sha256sum | cut -c1-24 )
          {
            echo "deps=$deps"
            echo "engine=$engine"
          } >> "$GITHUB_OUTPUT"
          echo "dependency recipe $deps, engine recipe $engine"

      # The engine scripts ask ninja and make for exactly two jobs. The wrapper
      # rewrites that one argument; nothing else about their recipes changes.
      - name: Let the engine scripts use more than two jobs
        run: |
          mkdir -p ci/bin
          printf '%s\n' '#!/bin/bash' \
            'args=(); for a in "$@"; do case "$a" in -j2) args+=("-j${LT_JOBS:-2}");; *) args+=("$a");; esac; done' \
            'exec "@REAL@" "${args[@]}"' > ci/bin/tool-template
          sed -e "s|@REAL@|$(command -v ninja)|" ci/bin/tool-template > ci/bin/ninja
          sed -e "s|@REAL@|$(command -v make)|" ci/bin/tool-template > ci/bin/make
          rm ci/bin/tool-template
          chmod +x ci/bin/ninja ci/bin/make
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          cat ci/bin/ninja

      - name: Cache the engine dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ci/deps
            ci/crypto
          key: lt-deps-arm64-${{ steps.recipes.outputs.deps }}

      - name: Cache the engine object tree
        uses: actions/cache@v4
        with:
          path: ci/engine-build
          # One tree per engine revision; any tree of this recipe is a starting point.
          key: lt-engine-${{ steps.recipes.outputs.deps }}-${{ steps.recipes.outputs.engine }}-j${{ env.LT_JOBS }}-${{ steps.engine.outputs.sha }}
          restore-keys: |
            lt-engine-${{ steps.recipes.outputs.deps }}-${{ steps.recipes.outputs.engine }}-j${{ env.LT_JOBS }}-

      - name: Cache the signing key
        uses: actions/cache@v4
        with:
          path: ci/debug.keystore
          key: lt-ci-debug-keystore-v1

      # The jailbreak build is its own application (org.un1box.android.jb) with its own key, in its own
      # cache entry: adding it to the entry above would have replaced that key's cache with one that has
      # no debug.keystore in it, and every normal build after that would sign with a brand-new key.
      - name: Cache the jailbreak signing key
        uses: actions/cache@v4
        with:
          path: ci/jailbreak.keystore
          key: lt-ci-jailbreak-keystore-v1

      - name: Use a stable keystore for the debug build
        run: |
          mkdir -p "$HOME/.android" ci
          if [ ! -f ci/debug.keystore ]; then
            keytool -genkeypair -keystore ci/debug.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ci/jailbreak.keystore ]; then
            keytool -genkeypair -keystore ci/jailbreak.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias un1boxjailbreak \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Un1box Jailbreak,O=Un1box,C=US"
          fi
          cp ci/debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore ci/debug.keystore -storepass android | tail -3
          SIGNER="$(keytool -list -v -keystore ci/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          [ -n "$SIGNER" ] || { echo '::error::the keystore has no androiddebugkey'; exit 1; }
          echo "LT_SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"
          echo "keystore signer: $SIGNER"
          JB_SIGNER="$(keytool -list -v -keystore ci/jailbreak.keystore -storepass android -alias un1boxjailbreak | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          [ -n "$JB_SIGNER" ] || { echo '::error::the jailbreak keystore has no un1boxjailbreak'; exit 1; }
          echo "LT_JB_SIGNER_SHA256=$JB_SIGNER" >> "$GITHUB_ENV"
          echo "jailbreak keystore signer: $JB_SIGNER"

      # The debug-only angle-gl route needs its three fixed provider DSOs staged into the
      # debug source set (Android/DEBUG-ANGLE.md). The bundle is pinned by the SHA256 of the
      # tarball itself, so the inner closure/notice pins are read from the verified bytes
      # instead of being restated here, and the staging script validates the whole closure
      # (ELF machine, fixed SONAMEs, dependency closure, 16 KiB LOAD alignment, notice
      # hashes) before Gradle ever sees it.
      - name: Fetch the packaged ARM64 ANGLE provider
        if: env.DECLARED_ANGLE_ARM64 != 'false'
        run: |
          curl -fsSL "$ANGLE_BUNDLE_URL" -o "$RUNNER_TEMP/angle-arm64.tar.gz"
          echo "$ANGLE_BUNDLE_SHA256  $RUNNER_TEMP/angle-arm64.tar.gz" | sha256sum -c -
          rm -rf ci/angle-arm64 && mkdir -p ci/angle-arm64
          tar xzf "$RUNNER_TEMP/angle-arm64.tar.gz" -C ci/angle-arm64 --strip-components=1
          ( cd ci/angle-arm64 && sha256sum -c SHA256SUMS )
          CLOSURE="$(sha256sum ci/angle-arm64/closure.json | cut -d' ' -f1)"
          NOTICES="$(sha256sum ci/angle-arm64/notices/manifest.json | cut -d' ' -f1)"
          python3 Android/scripts/stage-angle-runtime.py "$RUNNER_TEMP/angle-validate" \
            --bundle arm64-v8a "$PWD/ci/angle-arm64/libs" "$PWD/ci/angle-arm64/closure.json" \
              "$PWD/ci/angle-arm64/notices" "$CLOSURE" "$NOTICES" \
            --readelf "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --validate-only
          {
            echo "ANGLE_ARM64_LIBRARIES=$PWD/ci/angle-arm64/libs"
            echo "ANGLE_ARM64_MANIFEST=$PWD/ci/angle-arm64/closure.json"
            echo "ANGLE_ARM64_NOTICES=$PWD/ci/angle-arm64/notices"
            echo "ANGLE_ARM64_MANIFEST_SHA256=$CLOSURE"
            echo "ANGLE_ARM64_NOTICES_SHA256=$NOTICES"
          } >> "$GITHUB_ENV"
          echo "ARM64 ANGLE provider ready: closure $CLOSURE, notices $NOTICES"

      # Configures the whole Gradle build (plugins, dependency verification, the
      # Compose compiler) and compiles the app's sources before the engine build, so a
      # resolution or Kotlin/Java/AIDL error fails here, in about a minute, instead of
      # after the engine's three minutes in "Build the APK". Compilation needs neither the
      # engine nor firmwarekit: only the packaging tasks read those.
      # The wrapper asks services.gradle.org, which answers with a redirect to a GitHub release asset, and that
      # asset answered 504 for every run on 2026-11-09 -- the distribution could not be fetched at all, before
      # anything in this repository ran. The archive is pinned by SHA-256 in gradle-wrapper.properties, so a
      # mirror is another transport for the same bytes: try the canonical URL, then two mirrors, verify the
      # digest, and hand the wrapper the verified local file (file: URLs are what the wrapper supports for this).
      - name: Fetch the Gradle distribution (mirrors included)
        run: |
          EXPECTED="$(sed -n 's/^distributionSha256Sum=//p' Android/gradle/wrapper/gradle-wrapper.properties)"
          [ -n "$EXPECTED" ] || { echo '::error::gradle-wrapper.properties has no distributionSha256Sum to verify against'; exit 1; }
          OUT="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          URLS=(
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-8.11.1-bin.zip"
          )
          for URL in "${URLS[@]}"; do
            echo "trying $URL"
            if curl -fsSL --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 600 -o "$OUT" "$URL" &&
               echo "$EXPECTED  $OUT" | sha256sum -c -; then
              echo "verified the pinned archive from $URL"
              sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\://$OUT#" Android/gradle/wrapper/gradle-wrapper.properties
              cat Android/gradle/wrapper/gradle-wrapper.properties
              exit 0
            fi
            echo "::warning::$URL did not deliver the pinned archive"
          done
          echo "::error::no Gradle distribution source answered with the pinned archive"
          exit 1

      - name: Preflight the Gradle build
        working-directory: Android
        run: |
          # The packaged provider is a configuration input, so the preflight carries the same
          # properties the APK step does and a malformed bundle fails here, before the engine.
          angle_args=()
          if [ -n "${ANGLE_ARM64_MANIFEST_SHA256:-}" ]; then
            angle_args=(-PangleArm64Libraries="$ANGLE_ARM64_LIBRARIES" \
              -PangleArm64Manifest="$ANGLE_ARM64_MANIFEST" \
              -PangleArm64Notices="$ANGLE_ARM64_NOTICES" \
              -PangleArm64ManifestSha256="$ANGLE_ARM64_MANIFEST_SHA256" \
              -PangleArm64NoticesSha256="$ANGLE_ARM64_NOTICES_SHA256")
          fi
          gradlew() {
            ./gradlew --no-daemon --max-workers="$LT_JOBS" \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' \
              --dependency-verification="$DECLARED_DEPENDENCY_VERIFICATION" \
              -Pdebuggable="$DECLARED_DEBUGGABLE" "${angle_args[@]}" "$@"
          }
          VARIANT_CAP="${DECLARED_VARIANT^}"
          # Resolving the runtime classpath checks the pinned dependency verification; the dry
          # run configures every task without running it.
          gradlew :app:dependencies --configuration "${DECLARED_VARIANT}RuntimeClasspath" > /dev/null
          gradlew --dry-run ":app:assemble$VARIANT_CAP"
          # AIDL first (Kotlin compiles against its generated interfaces), then Kotlin and Java:
          # what the APK step compiles, none of what it packages.
          gradlew ":app:compile${VARIANT_CAP}Aidl" ":app:compile${VARIANT_CAP}Kotlin" ":app:compile${VARIANT_CAP}JavaWithJavac"

      # A cache hit is a tree the scripts' own recorded recipe accepts (the key is that recipe), so
      # there is nothing to rebuild. Without the skip this step spent ~3.5 minutes on every run
      # running make and ninja again over an already complete tree. The hit must also carry the
      # libraries the engine links; a tree without them is built again.
      - name: Build the engine dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true' || hashFiles('ci/deps/prefix/lib/libavcodec.a', 'ci/crypto/prefix/lib/libgcrypt.a') == ''
        run: |
          deps() {
            python3 qemu-ios/contrib/portable/build-deps.py ci/deps \
              --abi arm64-v8a --ndk "$ANDROID_NDK_ROOT" --meson "$MESON"
            python3 qemu-ios/contrib/portable/build-crypto-deps.py ci/crypto \
              --abi arm64-v8a --ndk "$ANDROID_NDK_ROOT"
          }
          # The pinned trees are cached, and a restored tree whose recipe no longer
          # matches is refused rather than silently reused: the recipe records the
          # workspace path, so renaming the repository is enough to stale it.
          # Retry once from an empty tree.
          deps || { rm -rf ci/deps ci/crypto; deps; }

      # The guest's only network backend is slirp, and the engine's
      # --without-default-features resolves that option's "auto" to disabled: -netdev user
      # did not exist, the Wi-Fi card's default netdev was never added ("Wi-Fi has no
      # network"), no lease came, and every app reported no connection. libslirp is built
      # for Android here, with the engine's own set-restricted/dns-forward patch, into the
      # prefix dependency('slirp') reads.
      - name: Build libslirp for Android
        run: |
          if [ -f ci/deps/prefix/lib/libslirp.a ]; then
            echo "libslirp is already in the dependency prefix; nothing to build"
            exit 0
          fi
          if [ ! -d ci/slirp-src/.git ]; then
            git clone --quiet https://gitlab.freedesktop.org/slirp/libslirp.git ci/slirp-src
            git -C ci/slirp-src checkout --quiet d09dc9a70360ee7838acccbd234ab83f3b9b37a5
          fi
          git -C ci/slirp-src apply "$GITHUB_WORKSPACE/qemu-ios/subprojects/packagefiles/libslirp-set-restricted.patch"
          BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo '[binaries]'
            echo "c = '$BIN/aarch64-linux-android29-clang'"
            echo "ar = '$BIN/llvm-ar'"
            echo "strip = '$BIN/llvm-strip'"
            echo "pkgconfig = 'pkg-config'"
            echo '[host_machine]'
            echo "system = 'android'"
            echo "cpu_family = 'aarch64'"
            echo "cpu = 'aarch64'"
            echo "endian = 'little'"
            echo '[properties]'
            echo 'needs_exe_wrapper = true'
          } > ci/libslirp-cross.txt
          PKG_CONFIG_LIBDIR="$PWD/ci/deps/prefix/lib/pkgconfig" \
            "$MESON" setup ci/libslirp-build ci/slirp-src \
            --cross-file ci/libslirp-cross.txt --buildtype=release \
            --default-library=static --prefix "$PWD/ci/deps/prefix"
          ninja -C ci/libslirp-build install
          ls -l ci/deps/prefix/lib/libslirp.a

      # Every layer of the microphone path, checked against the code that ships: the device's capture
      # FIFO (i2s_next_frame/i2s_rx_read sliced out of hw/arm/s5l8930_i2s.c with the `none` backend's
      # silent voice in front of it), the portable API, the JNI glue, and the wiring between them.
      # Seconds, against the ten minutes an engine build takes; `--sanitize` adds ASan/UBSan.
      - name: Self-check the microphone path
        # Reported, not gating: a compiler this job has never met could warn where the
        # author's did not, and a warning is not a reason to withhold an APK. A failed
        # check still shows in the run; locally the same command is strict.
        continue-on-error: true
        run: python3 tests/mic/run.py --engine qemu-ios

      # The camera path the same way: the frame slots (hw/arm/host-camera.c), the YUV_420_888 conversion the
      # app hands its frames through, the ISP model compiled whole against stub/, and the wiring from the
      # Settings switch to the engine's API.
      - name: Self-check the camera path
        continue-on-error: true
        run: python3 tests/camera/run.py --engine qemu-ios

      # The GL bridge the same way: the vertex array object state the engine keeps for the guest's
      # OES and EXT calls (sliced out of hw/arm/gles-host.c), the ids and argument counts in the
      # engine's own name table, and the contract around the patch that implements them.
      - name: Self-check the GL bridge
        continue-on-error: true
        run: python3 tests/gles/run.py --engine qemu-ios

      - name: Self-check the name and the idle loops
        continue-on-error: true
        run: |
          python3 tests/branding/run.py
          python3 tests/idle/run.py
          # The catalogues: every English key the screens pass to Text, and how much of the UI each
          # translation covers (tests/i18n/run.py, the check the catalogues' own docstrings name).
          python3 tests/i18n/run.py
          # Kotlin habits that cost a build each: a '#' comment, a tuple assignment, take(n) on a
          # ByteArray, a '/*' inside a doc comment (Kotlin's comments nest).
          python3 tests/kotlin/run.py

      # The guest's Wi-Fi link: the dongle model's association watchdog, sliced out of the engine and
      # driven with a fake clock (tests/network/run.py). iOS 5 drops a join that lands in the middle of
      # its first scan and nothing repeated it -- an iPad 1 had no network while iOS 6 and 7.1.2 did.
      - name: Self-check the guest's link
        continue-on-error: true
        run: python3 tests/network/run.py --engine qemu-ios

      # The archives firmwarekit's jailbreak option extracts, pinned by SHA-1 in SystemEdits/Cydia.swift:
      # the jailbreak self-check compares the tar this APK builds against the host's own on the real bytes
      # when they are here (a cache hit after the first run) and on its own fixtures when they are not.
      - name: Cache the pinned jailbreak archives
        uses: actions/cache@v4
        with:
          path: tests/jailbreak/archives
          key: jailbreak-archives-c943e5ec-264f4793-3a1302c6

      - name: Fetch the pinned jailbreak archives
        continue-on-error: true
        run: |
          mkdir -p tests/jailbreak/archives
          BASE="https://raw.githubusercontent.com/LukeZGD/Legacy-iOS-Kit/4b0a582f4d53e105be373b495734c8ed639fd634/resources/jailbreak"
          for entry in freeze.tar.gz:c943e5ece72b7b71da589c22663a8f9b3b3d1190 \
                       cydiasubstrate.tar:264f47938acc09e6cc2890a3cc7c7988a6822da3 \
                       cydiahttpatch.tar:3a1302c6294fe290c6d52186dd4fe56cda7fd661; do
            NAME="${entry%%:*}"; SHA1="${entry##*:}"
            [ -f "tests/jailbreak/archives/$NAME" ] && [ "$(sha1sum "tests/jailbreak/archives/$NAME" | cut -d' ' -f1)" = "$SHA1" ] && continue
            curl -fLsS --retry 3 "$BASE/$NAME" -o "tests/jailbreak/archives/$NAME"
            echo "$SHA1  tests/jailbreak/archives/$NAME" | sha1sum -c -
          done
          ls -la tests/jailbreak/archives

      # The jailbreak path: the tar firmwarekit's Cydia step runs as /usr/bin/tar, checked against the
      # host's own tar on the archives it is pinned to, and the shim redirect that reaches it through a
      # real spawn. No engine needed.
      - name: Self-check the jailbreak path
        continue-on-error: true
        run: python3 tests/jailbreak/run.py

      - name: Build the engine
        run: |
          set -o pipefail
          engine() {
            python3 qemu-ios/contrib/portable/build-engine.py ci/engine-build \
              --abi arm64-v8a --ndk "$ANDROID_NDK_ROOT" --android-api 29 \
              --prefix ci/deps/prefix --crypto-prefix ci/crypto/prefix "$@"
          }
          # Every line of the build is kept: a compile error used to leave nothing behind but
          # "exit code 1", and neither the step log nor an artifact could be fetched afterwards.
          # The log is annotated below on failure and uploaded by the step that follows.
          LOG=ci/engine-build.log
          : >> "$LOG"   # one file for both attempts: a refused --source-update still explains itself
          run_engine() {
            engine "$@" 2>&1 | tee -a "$LOG"
          }
          # The tree restored from another engine revision is updated in place when the only
          # recorded input that changed is the source revision (--source-update: ninja compiles
          # what moved, ~1.5 minutes less than a cold build). A tree whose configuration, tools
          # or dependencies changed is refused before anything compiles, and rebuilt from
          # scratch; so is one whose update fails, which is also the cold-build retry.
          status=0
          run_engine --source-update || {
            echo "::warning::the cached engine tree could not be updated in place (see the message above); rebuilding it from scratch"
            rm -rf ci/engine-build
            run_engine || status=$?
          }
          if [ "$status" -ne 0 ]; then
            # Annotations are the one thing the API still returns for a failed run, so the
            # compiler's own words go there, one line each, escaped for the command protocol.
            grep -aE 'error:|FAILED:' "$LOG" | head -5 | while IFS= read -r line; do
              echo "::error title=engine build::$(printf '%s' "$line" | cut -c1-900 | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            done || true   # no match, or head closing the pipe, is not itself a failure
            echo "---- last 40 lines of ci/engine-build.log ----"
            tail -40 "$LOG"
            exit "$status"
          fi

      - name: Keep the engine build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-build-log
          path: ci/engine-build.log
          if-no-files-found: ignore

      - name: Stage the engine next to the NDK C++ runtime
        run: |
          mkdir -p ci/engine/arm64-v8a
          cp ci/engine-build/libqemu-arm.so ci/engine/arm64-v8a/
          cp ci/engine-build/libc++_shared.so ci/engine/arm64-v8a/
          cp ci/engine-build/portable-manifest.json ci/engine/arm64-v8a/ 2>/dev/null || true
          ls -la ci/engine/arm64-v8a
          file ci/engine/arm64-v8a/libqemu-arm.so

      # The Jailbreak tab's own logic, where a wrong field or a wrong URL is invisible until an install
      # does nothing: the index parser, the source probing and the name a package is staged under
      # (Android/app/src/test, Android/app/src/main/java/org/un1box/android/JailbreakStore.kt).
      - name: Run the JVM unit tests
        continue-on-error: true
        working-directory: Android
        run: |
          ./gradlew --no-daemon --max-workers="$LT_JOBS" \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' \
            --dependency-verification="$DECLARED_DEPENDENCY_VERIFICATION" \
            :app:testReleaseUnitTest

      - name: Build the APK
        working-directory: Android
        run: |
          # A selected ARM64 ANGLE provider is staged by the Gradle task from these five
          # properties; with none set the generated provider directory stays empty.
          angle_args=()
          if [ -n "${ANGLE_ARM64_MANIFEST_SHA256:-}" ]; then
            angle_args=(-PangleArm64Libraries="$ANGLE_ARM64_LIBRARIES" \
              -PangleArm64Manifest="$ANGLE_ARM64_MANIFEST" \
              -PangleArm64Notices="$ANGLE_ARM64_NOTICES" \
              -PangleArm64ManifestSha256="$ANGLE_ARM64_MANIFEST_SHA256" \
              -PangleArm64NoticesSha256="$ANGLE_ARM64_NOTICES_SHA256")
          fi
          ./gradlew --no-daemon --max-workers="$LT_JOBS" \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' \
            --dependency-verification="$DECLARED_DEPENDENCY_VERIFICATION" \
            -PnativeJobs="$LT_JOBS" \
            -PtargetAbis=arm64-v8a \
            -PportableDir="$GITHUB_WORKSPACE/Portable" \
            -PqemuSource="$GITHUB_WORKSPACE/qemu-ios" \
            -PengineRoot="$GITHUB_WORKSPACE/ci/engine" \
            -PfirmwareKitDir="$GITHUB_WORKSPACE/ci/firmwarekit/android" \
            -PguestToolsDir="$GITHUB_WORKSPACE/ci/guest-tools" \
            -PmobileServicesArm64="$GITHUB_WORKSPACE/ci/mobile-services/arm64-v8a" \
            -PsourceRevision="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            -PsourceReference="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}" \
            -Pdebuggable="$DECLARED_DEBUGGABLE" \
            -Pjailbreak="$DECLARED_JAILBREAK" \
            "${angle_args[@]}" \
            ":app:assemble${DECLARED_VARIANT^}"

      # firmwarekit's k48 recipe asks for "<nativeLibraryDir>/iBoot32Patcher": a bundle-style name an APK
      # cannot carry through jniLibs, which packages only lib*.so. The entry is appended to the assembled APK
      # instead (append mode leaves every existing entry, its compression and its alignment alone, which
      # matters for resources.arsc), and the installer extracts lib/<abi>/ entries verbatim. The preloaded
      # spawn shim also redirects that name to libiBoot32Patcher.so, so either route finds the tool.
      - name: Add the patcher under the name firmwarekit looks for
        working-directory: Android
        run: |
          APK="$(ls "app/build/outputs/apk/$DECLARED_VARIANT/"*.apk | head -1)"
          python3 - "$APK" ../ci/firmwarekit/android/iBoot32Patcher <<'PY'
          import sys, zipfile, pathlib
          apk, patcher = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          data = patcher.read_bytes()
          with zipfile.ZipFile(apk, "a") as archive:
              names = archive.namelist()
              entry = "lib/arm64-v8a/iBoot32Patcher"
              if entry in names:
                  raise SystemExit(f"{apk} already carries {entry}")
              info = zipfile.ZipInfo(entry)
              info.external_attr = 0o755 << 16
              info.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(info, data)
          with zipfile.ZipFile(apk) as check:
              assert check.read("lib/arm64-v8a/iBoot32Patcher") == data
          print(f"added lib/arm64-v8a/iBoot32Patcher ({len(data)} bytes) to {apk}")
          PY

      # AGP signs a debug build with whatever it finds (or makes) at
      # ~/.android/debug.keystore, which is not the cached key: a run would then
      # hand out an APK that cannot update the one before it. Sign with this
      # workflow's keystore instead, and the check step requires the digest.
      - name: Sign the APK with the workflow's keystore
        working-directory: Android
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          # The release variant has no signing config, so AGP writes app-release-unsigned.apk;
          # the debug variant's file is app-debug.apk. Either is signed here, with the key this build's
          # application id belongs to: the jailbreak app (org.un1box.android.jb) has its own.
          if [ "$DECLARED_JAILBREAK" = "true" ]; then
            KEYSTORE="$GITHUB_WORKSPACE/ci/jailbreak.keystore"; ALIAS="un1boxjailbreak"
          else
            KEYSTORE="$GITHUB_WORKSPACE/ci/debug.keystore"; ALIAS="androiddebugkey"
          fi
          APK="$(ls "app/build/outputs/apk/$DECLARED_VARIANT/"*.apk | head -1)"
          echo "signing $APK with $KEYSTORE ($ALIAS)"
          "$APKSIGNER" sign --ks "$KEYSTORE" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias "$ALIAS" \
            --in "$APK" --out app-signed.apk
          mv app-signed.apk "$APK"

      - name: Check the APK and write provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENGINE_SHORT="$(git -C qemu-ios rev-parse --short HEAD)"
          JAILBREAK_SUFFIX=""
          [ "$DECLARED_JAILBREAK" = "true" ] && JAILBREAK_SUFFIX="-jailbreak"
          APK="ci/Un1box-${ENGINE_SHORT}-arm64-${DECLARED_VARIANT}${JAILBREAK_SUFFIX}.apk"
          cp "$(ls "Android/app/build/outputs/apk/$DECLARED_VARIANT/"*.apk | head -1)" "$APK"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          SIGNED="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          EXPECTED="$LT_SIGNER_SHA256"
          if [ "$DECLARED_JAILBREAK" = "true" ]; then EXPECTED="$LT_JB_SIGNER_SHA256"; fi
          [ "$SIGNED" = "$EXPECTED" ] || {
            echo "::error::the APK carries signer $SIGNED, not this build's keystore ($EXPECTED): a phone could not update its previous install of this application"
            exit 1
          }
          echo "- signer: $SIGNED (this application's keystore, so an install updates in place)"
          # check-apk.py targets uncompressed packaging; this APK extracts its
          # libraries so firmwarekit can run out of nativeLibraryDir.
          python3 Android/scripts/check-apk.py "$APK" ||
            echo "::warning::check-apk.py expects uncompressed native libraries; legacy packaging is expected here"
          {
            echo "# Un1box perf APK"
            echo
            echo "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) by run ${{ github.run_number }} of this workflow."
            echo
            echo "- application revision: $(git rev-parse HEAD) ($GITHUB_REPOSITORY)"
            echo "- engine revision: $(git -C qemu-ios rev-parse HEAD) ($ENGINE_REPO $ENGINE_REF)"
            echo "- engine build: arm64-v8a, NDK $ANDROID_NDK_VERSION, --android-api 29, $LT_JOBS jobs"
            echo "- reused from ${BASE_RELEASE_RESOLVED:-$DECLARED_BASE_RELEASE_REPO $DECLARED_BASE_RELEASE_TAG}: firmwarekit, lighttouch-oneshot, USB bridge, it_seal"
            echo "- guest itpacks: serial 42 from guest-package run ${GUEST_PACKAGE_RUN_ID}"
            ANGLE_TAG="${ANGLE_BUNDLE_URL:-}"; ANGLE_TAG="${ANGLE_TAG%/*}"; ANGLE_TAG="${ANGLE_TAG##*/}"
            if [ -n "${ANGLE_ARM64_MANIFEST_SHA256:-}" ]; then
              echo "- ARM64 ANGLE provider: $ANGLE_TAG (${ANGLE_BUNDLE_URL##*/}), closure $ANGLE_ARM64_MANIFEST_SHA256, notices $ANGLE_ARM64_NOTICES_SHA256"
            else
              echo "- ARM64 ANGLE provider: not packaged"
            fi
            echo "- variant: $DECLARED_VARIANT (debuggable: $DECLARED_DEBUGGABLE)"
            if [ "$DECLARED_JAILBREAK" = "true" ]; then
              echo "- application: org.un1box.android.jb, signed with the jailbreak keystore ($LT_JB_SIGNER_SHA256):"
              echo "  its own application, so it installs beside the normal Un1box and its devices are prepared"
              echo "  again inside it"
              echo "- jailbreak build: every preparation passes --jailbreak (afc2, Cydia and Substrate, from the"
              echo "  pinned Legacy-iOS-Kit bootstrap), and firmwarekit's Cydia step runs the shim-redirected"
              echo "  jb-tar in place of the /usr/bin/tar Android does not have"
            else
              echo "- application: org.un1box.android, signed with the debug keystore ($LT_SIGNER_SHA256)"
              echo "- jailbreak build: no (preparations are stock; use the Jailbreak APK workflow for one)"
            fi
            echo
            echo "## Engine commits in $ENGINE_REF that are not in main"
            echo
            gh api "repos/$ENGINE_REPO/compare/main...$(git -C qemu-ios rev-parse HEAD)" \
              --jq '.commits[] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || echo "- (compare unavailable)"
            echo
            echo "## Engine switches for an A/B on the phone"
            echo
            echo "A debuggable APK reads KEY=VALUE lines from its own files/debug-env, for example:"
            echo
            echo "    adb shell run-as org.un1box.android sh -c \"printf 'LT_BQL_SPIN=off\\n' > files/debug-env\""
            echo
            echo "Each run is a full engine start, so measure the same scene twice per setting."
          } > ci/PROVENANCE.txt
          cat ci/PROVENANCE.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Un1box-perf-apk-${{ steps.engine.outputs.sha }}${{ inputs.jailbreak == 'true' && '-jailbreak' || '' }}
          path: |
            ci/Un1box-*-arm64-*.apk
            ci/PROVENANCE.txt

      - name: Attach the APK to a pre-release
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A jailbreak build gets its own tag prefix: it is a different application (its own id, its own
          # key), so a phone holds both and the two releases must not be confused for one another.
          if [ "$DECLARED_JAILBREAK" = "true" ]; then PREFIX="jb"; else PREFIX="ci"; fi
          TAG="$PREFIX-$(git -C qemu-ios rev-parse --short HEAD)-r${{ github.run_number }}"
          gh release create "$TAG" ci/Un1box-*.apk ci/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "$TAG" --notes-file ci/PROVENANCE.txt
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"